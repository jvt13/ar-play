name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Unit tests and Pages compatibility
        run: npm test
      - name: JavaScript syntax
        run: npm run check
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Browser, simulated camera and offline tests under /ar-play/
        run: python tests/browser_test.py
      - name: Stage public application files only
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/ar-play-pages"
          mkdir -p "$site_dir"
          cp index.html style.css manifest.webmanifest sw.js "$site_dir/"
          cp -R src icons "$site_dir/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ar-play-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
